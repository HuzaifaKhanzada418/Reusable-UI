<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reusable UI Components</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="header">

            <h1>Reusable UI Components</h1>

            <p>
                Build reusable Button, Card,
                Modal and Toast components using Vanilla JavaScript.
            </p>

        </header>

        <!-- Buttons Section -->


        <section class="section">

            <h2>Buttons</h2>

            <div id="button-demo" class="button-demo"></div>

        </section>


        <!-- Cards Section -->


        <section class="section">

            <h2>Cards</h2>

            <div id="card-demo" class="card-grid"></div>

        </section>


        <!-- Modal Section -->


        <section class="section">

            <h2>Modal Demo</h2>

            <div id="modal-buttons" class="button-demo"></div>

        </section>


        <!-- Toast Section -->


        <section class="section">

            <h2>Toast Notifications</h2>

            <div id="toast-buttons" class="button-demo"></div>

        </section>

    </div>


    <!-- Modal Root -->
    <div id="modal-root"></div>


    <!-- Toast Root -->
    <div id="toast-container"></div>


    <!-- Main JS -->
    <script src="script.js"></script>

</body>

</html>
